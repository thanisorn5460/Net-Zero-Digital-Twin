<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Net Zero Digital Twin · Demo Tower</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8EDEA;--panel:#F6F8F7;--ink:#17221E;--ink2:#58655F;--line:#CBD5D0;--chip:#DDE5E1;
  --good:#12874A;--bad:#B5372B;--grid:#2F6F8F;--sun:#D99A0B;--s1:#C4572A;--s2:#3F5E6B;
  --sky:#DCE6E2;--ground:#B4C2BA;--plaza:#CDD8D2;--road:#7E8A84;--bld:#A6B5AD;--slab:#E6ECE8;--roof:#8D9893;--edge:#2B3B34;
  --is-dark:0;--glass:86%;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1411;--panel:#131C18;--ink:#E5EDE9;--ink2:#93A29B;--line:#25322C;--chip:#1D2923;
    --good:#3CC882;--bad:#E4685A;--grid:#63AACB;--sun:#F0B53A;--s1:#E27C4C;--s2:#82A3B1;
    --sky:#0F1A16;--ground:#16211C;--plaza:#1D2A24;--road:#2A3731;--bld:#26332D;--slab:#3A4842;--roof:#3C4842;--edge:#BFE3D0;
    --is-dark:1;--glass:80%;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1411;--panel:#131C18;--ink:#E5EDE9;--ink2:#93A29B;--line:#25322C;--chip:#1D2923;
  --good:#3CC882;--bad:#E4685A;--grid:#63AACB;--sun:#F0B53A;--s1:#E27C4C;--s2:#82A3B1;
  --sky:#0F1A16;--ground:#16211C;--plaza:#1D2A24;--road:#2A3731;--bld:#26332D;--slab:#3A4842;--roof:#3C4842;--edge:#BFE3D0;
  --is-dark:1;--glass:80%;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:'IBM Plex Sans Thai',system-ui,'Noto Sans Thai',Tahoma,sans-serif;font-size:13px;line-height:1.5;
  display:grid;grid-template-rows:auto minmax(0,1fr) auto;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--good);outline-offset:2px}

#top{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
#top h1{margin:0;font-size:15px;font-weight:600;letter-spacing:.1px}
#top p{margin:0;color:var(--ink2);font-size:12px}
#top .sp{flex:1}
.badge{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.ib{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:transparent;cursor:pointer;display:grid;place-items:center}
.ib:hover{background:var(--chip)}
.ib svg{width:16px;height:16px;stroke:var(--ink2);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

#main{display:grid;grid-template-columns:minmax(0,1fr) 396px;min-height:0}
#stage{position:relative;min-height:0;overflow:hidden;background:var(--sky)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl:active{cursor:grabbing}
#panel{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-left:1px solid var(--line)}
@media (max-width:860px){
  #main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(250px,1fr) minmax(0,40vh)}
  #panel{border-left:0;border-top:1px solid var(--line)}
  #top p{display:none}
  #top h1{white-space:nowrap;font-size:14px}
}
@media (max-width:520px){.badge{display:none}}

#tools{position:absolute;top:10px;left:10px;right:10px;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none}
#tools>*{pointer-events:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:5px 11px;cursor:pointer;color:var(--ink2)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--panel);font-weight:500}
#langSeg button{padding:4px 9px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:5px 10px;cursor:pointer;color:var(--ink2)}
.chip[aria-pressed=true]{border-color:var(--good);color:var(--ink);box-shadow:inset 0 0 0 1px var(--good)}
#legend{position:absolute;left:10px;bottom:10px;width:min(300px,calc(100% - 20px));padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:11px;color:var(--ink2)}
#legend .bar{height:8px;border-radius:4px;margin:5px 0 3px}
#legend .tk{position:relative;height:14px}
#legend .tk span{position:absolute;transform:translateX(-50%);white-space:nowrap}
#legend .tk span.z{color:var(--good);font-weight:600}
#tags{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;transform:translate(-50%,-100%);padding:3px 9px;border-radius:8px;background:var(--panel);border:1px solid var(--line);font-size:12px;white-space:nowrap;pointer-events:auto;cursor:default;z-index:1;outline-offset:2px}
@supports ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))) and (background:color-mix(in srgb,red 50%,transparent)){
  .tag{background:color-mix(in srgb,var(--panel) 80%,transparent);border-color:color-mix(in srgb,var(--line) 60%,transparent);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px)}
}
.tag .tg-bar,.tag .tg-sub{display:none}
.tag:hover,.tag:focus-visible,.tag.open{background:var(--panel);border-color:var(--line);-webkit-backdrop-filter:none;backdrop-filter:none;min-width:170px;z-index:5;padding:4px 9px 5px;box-shadow:0 2px 10px rgba(0,0,0,.14)}
.tag:hover .tg-bar,.tag:focus-visible .tg-bar,.tag.open .tg-bar{display:block}
.tag:hover .tg-sub,.tag:focus-visible .tg-sub,.tag.open .tg-sub{display:block}
.tag .tg1{display:flex;align-items:center;gap:0}
.tag .tg-bar{height:3px;background:var(--chip);border-radius:2px;margin-top:5px;overflow:hidden}
.tag .tg-bar i{display:block;height:100%;border-radius:2px}
.tag .tg-sub{font-size:11px;color:var(--ink2);margin-top:3px}
.tag .tg-sub .ic{width:12px;height:12px;margin-right:4px;vertical-align:-2px}
.tag.fade{animation:tagfade .18s ease-out}
@keyframes tagfade{from{opacity:0;margin-top:5px}to{opacity:1;margin-top:0}}
.tag b{font-weight:600}
.tag.shift::after,.tag.moved::after{display:none}
.tag::after{content:"";position:absolute;left:50%;bottom:-5px;width:1px;height:5px;background:var(--ink2)}
#tip{position:absolute;display:none;min-width:190px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:12px;pointer-events:none;z-index:5}
#tip b{font-weight:600}
#tip .r{display:flex;justify-content:space-between;gap:14px;color:var(--ink2)}
#tip .r span:last-child{color:var(--ink)}
#fallback{position:absolute;inset:0;display:none;place-items:center;text-align:center;color:var(--ink2);padding:24px}

#tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tab{flex:1;padding:10px 4px;background:none;border:0;border-bottom:2px solid transparent;color:var(--ink2);cursor:pointer;white-space:nowrap}
.tab[aria-selected=true]{color:var(--ink);font-weight:600;border-bottom-color:var(--good)}
#body{overflow:auto;padding:14px 14px 18px;flex:1;min-height:0}
#body h2{margin:0 0 2px;font-size:19px;font-weight:600}
#body h3{margin:16px 0 6px;font-size:13px;font-weight:600}
.mut{color:var(--ink2)}
.small{font-size:11.5px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto 84px;gap:8px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .v{font-weight:500;text-align:right}
.row .d{font-size:11.5px;text-align:right}
.good{color:var(--good)}.bad{color:var(--bad)}
.note{margin-top:14px;padding:9px 11px;border-radius:9px;background:var(--chip);color:var(--ink2);font-size:11.5px}
.big{font-size:34px;font-weight:600;line-height:1.1;letter-spacing:-.3px}
.unit{font-size:12px;font-weight:400;color:var(--ink2);margin-left:4px}
svg.ch{width:100%;height:auto;display:block;overflow:visible}
svg.ch text{fill:var(--ink2);font-size:9.5px;font-family:inherit}
svg.ch .ax{stroke:var(--line);stroke-width:1}
.stack{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--chip);margin:6px 0 8px}
.stack i{display:block;height:100%}
.leg{display:grid;grid-template-columns:1fr 1fr;gap:3px 10px;font-size:11.5px}
.leg span{display:flex;align-items:center;gap:6px;min-width:0}
.leg em{width:9px;height:9px;border-radius:3px;flex:none}
.leg u{text-decoration:none;margin-left:auto;color:var(--ink2)}
.gauge{position:relative;height:10px;border-radius:5px;background:var(--chip);margin:22px 0 22px}
.gauge .fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.gauge .mk{position:absolute;top:-16px;transform:translateX(-50%);font-size:10.5px;white-space:nowrap}
.gauge .mk::after{content:"";position:absolute;left:50%;top:15px;width:2px;height:16px;background:currentColor;transform:translateX(-50%)}
.gauge .mk.t{color:var(--good);font-weight:600}
.gauge .mk.c{color:var(--ink);top:auto;bottom:-20px}
.gauge .mk.c::after{top:-16px}
table.t{width:100%;border-collapse:collapse;font-size:12px}
table.t th{font-weight:500;color:var(--ink2);text-align:right;padding:4px 0;border-bottom:1px solid var(--line)}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t td{text-align:right;padding:5px 0;border-bottom:1px solid var(--line)}
.ctl{display:flex;flex-wrap:wrap;gap:10px 14px;margin:10px 0 4px}
.ctl label{display:flex;flex-direction:column;gap:2px;font-size:11.5px;color:var(--ink2)}
.ctl select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
.frow{display:grid;grid-template-columns:10px 34px minmax(0,1fr) 54px;gap:8px;align-items:center;width:100%;padding:6px 4px;border:0;border-bottom:1px solid var(--line);background:none;cursor:pointer;text-align:left;position:relative}
.frow:hover,.frow.on{background:var(--chip)}
.frow .dot{width:10px;height:10px;border-radius:3px}
.frow .fn{font-weight:600}
.frow .fu{color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.frow .fv{text-align:right;font-weight:500}
.frow .fb{position:absolute;left:0;bottom:0;height:2px;width:100%}
.frow .fb i{display:block;height:100%}
.spark{width:100%;height:auto;display:block}

#time{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:8px 14px 10px;border-top:1px solid var(--line);background:var(--panel)}
#play{width:34px;height:34px;border-radius:50%;border:0;background:var(--ink);color:var(--panel);cursor:pointer;display:grid;place-items:center}
#play svg{width:14px;height:14px;fill:currentColor}
#mlabel{font-size:15px;font-weight:600;min-width:78px;text-align:right}
#ev{grid-column:2;font-size:11.5px;color:var(--ink2);min-height:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#rangeWrap{position:relative}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;margin:0;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--line)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-6px;border-radius:50%;background:var(--good);border:2px solid var(--panel)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--good);border:2px solid var(--panel)}
#ticks{position:relative;height:12px;margin-top:-2px}
#ticks button{position:absolute;top:0;width:8px;height:12px;margin-left:-4px;padding:0;border:0;background:none;cursor:pointer}
#ticks button::before{content:"";display:block;width:2px;height:8px;margin:0 auto;background:var(--ink2);border-radius:1px}
#ticks button.pv::before{background:var(--sun)}#ticks button.eff::before{background:var(--good)}#ticks button.s1::before{background:var(--s1)}
#yrs{position:relative;height:12px;font-size:10px;color:var(--ink2)}
#yrs span{position:absolute;transform:translateX(-50%)}
.sl{margin:10px 0 2px}
.sl .t{display:flex;justify-content:space-between;gap:8px;font-size:12px}
.sl .t b{font-weight:500;white-space:nowrap}
.sl input[type=range]{height:18px}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
table.t.sm{font-size:11px}
table.t.sm th,table.t.sm td{padding:4px 0}
.ok{color:var(--good)}
.note b{color:var(--ink);font-weight:600}
.note ul{margin:6px 0 0;padding-left:18px}
.note li{margin:4px 0;padding-left:2px}
.note li::marker{color:var(--ink2)}
.sw{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-size:12.5px;user-select:none;position:relative}
.sw input{position:absolute;opacity:0;width:0;height:0}
.sw .trk{width:38px;height:22px;border-radius:99px;background:var(--line);position:relative;transition:background .15s;flex:none}
.sw .trk::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--panel);transition:transform .15s}
.sw input:checked+.trk{background:var(--good)}
.sw input:checked+.trk::after{transform:translateX(16px)}
.sw input:focus-visible+.trk{outline:2px solid var(--good);outline-offset:2px}
.sw b{font-weight:600}
#tip{width:262px;min-width:0;padding:12px}
.tp-h{display:flex;align-items:center;gap:7px}
.tp-h .dot{width:10px;height:10px;border-radius:3px;flex:none}
.tp-h b{font-size:14px;font-weight:600}
.tp-h .u{font-size:11px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tp-chip{margin-left:auto;font-size:11px;padding:1px 8px;border-radius:99px;color:var(--ink);white-space:nowrap;flex:none}
.tp-sub{font-size:11px;color:var(--ink2);margin:2px 0 8px}
.tp-k{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.tp-k>div{background:var(--chip);border-radius:8px;padding:6px 8px;min-width:0}
.tp-k i{font-style:normal;font-size:11px;color:var(--ink2);display:block}
.tp-k b{font-size:15px;font-weight:600;display:block;line-height:1.25}
.tp-k s{text-decoration:none;font-size:11px;display:block;color:var(--ink2);white-space:nowrap}
.tp-bar{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:10px 0 7px;background:var(--chip)}
.tp-bar i{display:block;height:100%}
.tp-leg{display:grid;grid-template-columns:1fr 1fr;gap:2px 8px;font-size:11px;color:var(--ink2)}
.tp-leg b{color:var(--ink);font-weight:500}
.tp-rk{font-size:11px;color:var(--ink2);margin:10px 0 3px}
.tp-rk b{color:var(--ink);font-weight:600}
.tp-ft{border-top:1px solid var(--line);margin-top:8px;padding-top:7px;font-size:11px;color:var(--ink2)}
@media (min-width:641px){
  :root{--pw:clamp(300px,42vw,396px)}
  #main{position:relative;display:block}
  #stage{position:absolute;inset:0}
  #panel{position:absolute;top:0;right:0;bottom:0;width:var(--pw);border-left:1px solid var(--line);border-top:0}
  #stage #tools{right:calc(var(--pw) + 56px)}
  #stage .pbtn{right:calc(var(--pw) + 10px)}
  #main.nopanel #stage #tools{right:56px}
  #main.nopanel #stage .pbtn{right:10px}
  #panel{background:color-mix(in srgb,var(--panel) 96%,transparent)}
}
@supports ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))) and (background:color-mix(in srgb,red 50%,transparent)){
  @media (min-width:641px){
    #panel{background:color-mix(in srgb,var(--panel) var(--glass),transparent);-webkit-backdrop-filter:blur(12px) saturate(1.1);backdrop-filter:blur(12px) saturate(1.1)}
  }
}
@media (prefers-reduced-transparency:reduce){#panel,.tag{background:var(--panel)!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}}
#main.nopanel{grid-template-columns:minmax(0,1fr)}
#main.nopanel #panel{display:none}
#tools{right:56px}
.pbtn{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--ink2);cursor:pointer;display:grid;place-items:center;padding:0}
.pbtn:hover{background:var(--chip);color:var(--ink)}
.pbtn svg.ic{width:18px;height:18px;vertical-align:0}
@media (max-width:860px){#main.nopanel{grid-template-rows:minmax(0,1fr)}}
svg.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-3px}
.row .ic,.sl .ic{margin-right:8px;color:var(--ink2)}
.tab{display:flex;align-items:center;justify-content:center;gap:4px;font-size:12.5px;padding:10px 2px;min-width:0}
.tab svg.ic{width:15px;height:15px}
.chip,.seg button{display:inline-flex;align-items:center;gap:6px}
.tag .ic{width:14px;height:14px;margin-right:5px;vertical-align:-2px}
.sl .t span{display:flex;align-items:center;min-width:0}
@media (min-width:641px) and (max-width:900px){
  .tab .lbl{display:none}
  .tab[aria-selected=true]{flex:2.4}
  .tab[aria-selected=true] .lbl{display:inline}
}
@media (max-width:520px){
  #tools .lbl{display:none}
  #tools .chip,#tools .seg button{padding:7px 10px}
  .tab .lbl{display:none}
  .tab[aria-selected=true]{flex:2.4}
  .tab[aria-selected=true] .lbl{display:inline}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:860px){
  #tools{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  #tools>*{flex:none}
  #legend{width:200px;padding:6px 8px;font-size:10px}
  #legend .mut{display:none}
}
</style>

function eqVal(i,k){return st.mode==='energy'?annKwhM2(i,k):annKgM2(i,k)/B.ef[k]}
function yoy(arr,k){return k>=12&&arr[k-12]>0?(arr[k]-arr[k-12])/arr[k-12]:null}
function dTxt(p,goodDown){if(p===null)return '';var up=p>0;var cls=(up===!!goodDown)?'bad':'good';return '<span class="'+cls+'">'+(up?'\u25B2 ':'\u25BC ')+nf(Math.abs(p)*100,1)+'%</span>'}

var STOPS=[[0,[23,160,93]],[57,[37,168,95]],[90,[227,194,39]],[140,[232,137,43]],[250,[194,59,43]],[400,[125,28,43]]];
function heatRGB(v){
  for(var i=1;i<STOPS.length;i++){
    if(v<=STOPS[i][0]){var a=STOPS[i-1],b=STOPS[i],t=Math.max(0,(v-a[0])/(b[0]-a[0]));
      return [a[1][0]+(b[1][0]-a[1][0])*t,a[1][1]+(b[1][1]-a[1][1])*t,a[1][2]+(b[1][2]-a[1][2])*t]}}
  return STOPS[STOPS.length-1][1].slice();
}
function rgbCss(c){return 'rgb('+Math.round(c[0])+','+Math.round(c[1])+','+Math.round(c[2])+')'}
function heatCss(v){return rgbCss(heatRGB(v))}

/* ====================================================== aggregates */
function annual(y){var r=yearRange(y);return {s1:sum(B.s1,r[0],r[1]),s2:sum(B.s2,r[0],r[1]),tot:sum(B.total,r[0],r[1]),pv:sum(B.pv,r[0],r[1]),grid:sum(B.grid,r[0],r[1]),n:r[1]-r[0]+1}}
var YEARS=[2020,2021,2022,2023,2024,2025,2026];
var ANN={};YEARS.forEach(function(y){ANN[y]=annual(y)});
function est26(){
  var a=yearRange(2026)[0],n=LAST-a+1,p=yearRange(2025)[0];
  var y2=ANN[2026],y25=sum(B.s2,p,p+n-1),q4=sum(B.s2,p+n,p+11);
  var g25=sum(B.grid,p,p+n-1),g4=sum(B.grid,p+n,p+11);
  var t25=sum(B.total,p,p+n-1),t4=sum(B.total,p+n,p+11);
  return {s2:y2.s2+q4*y2.s2/y25,s1:y2.s1*12/n,grid:y2.grid+g4*y2.grid/g25,tot:y2.tot+t4*y2.tot/t25,n:n}
}
var E26=est26();
function tco2(y){return y===2026?E26.s1+E26.s2:ANN[y].s1+ANN[y].s2}
function nzModel(){
  var bs=st.base,base=tco2(bs),d=st.efd;
  var ef26=B.ef[LAST];
  var s1bau=(ANN[2023].s1+ANN[2024].s1+ANN[2025].s1)/3;
  var bau=function(y){return y<=2026?tco2(y):E26.grid*ef26*Math.pow(1-d,y-2026)/1000+s1bau};
  var tgt=function(y){return y<bs?null:base*Math.max(0,1-(y-bs)/(2050-bs))};
  return {base:base,bs:bs,bau:bau,tgt:tgt,ef:function(y){return ef26*Math.pow(1-d,y-2026)},s1bau:s1bau}
}
function zebStats(k){
  var a=Math.max(0,k-11),n=k-a+1,f=12/n;
  var kwh=sum(B.total,a,k)*f,pv=sum(B.pv,a,k)*f;
  return {sec:kwh/A,net:(kwh-pv)/A,n:n,a:a,kwh:kwh,pv:pv}
}

  var s='<svg class="ch" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+tr('Monthly electricity use and Solar PV output','ไฟฟ้ารายเดือนและ Solar PV')+'">';
  [0,250000,500000].forEach(function(v){s+='<line class="ax" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(v)+'" y2="'+Y(v)+'"/><text x="'+(pl-4)+'" y="'+(Y(v)+3)+'" text-anchor="end">'+(v/1000)+'</text>'});
  var line='',area='',i;
  for(i=0;i<N;i++){line+=(i?'L':'M')+X(i).toFixed(1)+' '+Y(B.total[i]).toFixed(1)}
  area='M'+X(0)+' '+Y(0);for(i=0;i<N;i++)area+='L'+X(i).toFixed(1)+' '+Y(B.pv[i]).toFixed(1);area+='L'+X(N-1)+' '+Y(0)+'Z';
  s+='<path d="'+area+'" fill="var(--sun)" opacity=".55"/><path d="'+line+'" fill="none" stroke="var(--ink)" stroke-width="1.4"/>';
  for(var y=2020;y<=2026;y++){s+='<text x="'+X((y-2020)*12)+'" y="'+(H-4)+'" text-anchor="middle">'+y+'</text>'}
  D.events.forEach(function(e){s+='<circle cx="'+X(e.i)+'" cy="'+Y(B.total[e.i])+'" r="2.6" fill="var(--panel)" stroke="var(--ink)" stroke-width="1"/>'});
  var cx=X(st.idx);s+='<line x1="'+cx+'" x2="'+cx+'" y1="'+pt+'" y2="'+(H-pb)+'" stroke="var(--good)" stroke-width="1.5"/><circle cx="'+cx+'" cy="'+Y(B.total[st.idx])+'" r="3.6" fill="var(--good)"/>';
  s+='<text x="'+pl+'" y="'+(pt-1)+'">'+tr('MWh / month','MWh/เดือน')+'</text>';
  s+='<rect x="0" y="0" width="'+W+'" height="'+H+'" fill="transparent" data-chart="m" data-pl="'+pl+'" data-pr="'+pr+'" data-w="'+W+'"/></svg>';
  return s;

  var z=zebStats(k);vals.push({l:tr('12 mo','12 เดือน'),l2:tr('to ','ถึง ')+lbl(k),g:net?z.net:z.sec,n:net?z.sec:z.net,cur:1});

function nzChart(m,scn){
  var W=360,H=210,pl=38,pr=10,pt=14,pb=24,y0=2020,y1=2050;
  var X=function(y){return pl+(W-pl-pr)*(y-y0)/(y1-y0)};
  var vmax=0;YEARS.forEach(function(y){vmax=Math.max(vmax,tco2(y))});vmax=Math.max(vmax,m.base)*1.1;
  var step=vmax>2400?1000:500;
  var Y=function(v){return pt+(H-pt-pb)*(1-v/vmax)};
  var s='<svg class="ch" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+tr('Pathway to Net Zero by 2050','เส้นทางสู่ Net Zero ปี 2050')+'">';
  for(var v=0;v<=vmax;v+=step)s+='<line class="ax" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(v)+'" y2="'+Y(v)+'"/><text x="'+(pl-4)+'" y="'+(Y(v)+3)+'" text-anchor="end">'+nf(v)+'</text>';
  var bw=(W-pl-pr)/(y1-y0)*0.72;
  YEARS.forEach(function(y){
    var s2=y===2026?E26.s2:ANN[y].s2,s1=y===2026?E26.s1:ANN[y].s1,x=X(y)-bw/2,op=y===2026?0.5:1;
    s+='<rect x="'+x+'" y="'+Y(s2)+'" width="'+bw+'" height="'+(Y(0)-Y(s2))+'" fill="var(--s2)" opacity="'+op+'"/>';
    s+='<rect x="'+x+'" y="'+Y(s1+s2)+'" width="'+bw+'" height="'+(Y(s2)-Y(s1+s2))+'" fill="var(--s1)" opacity="'+op+'"/>';
  });
  var p='';for(var y=2026;y<=2050;y++)p+=(y===2026?'M':'L')+X(y).toFixed(1)+' '+Y(m.bau(y)).toFixed(1);
  s+='<path d="'+p+'" fill="none" stroke="var(--bad)" stroke-width="1.6" stroke-dasharray="4 3"/>';
  s+='<line x1="'+X(m.bs)+'" y1="'+Y(m.base)+'" x2="'+X(2050)+'" y2="'+Y(0)+'" stroke="var(--good)" stroke-width="2"/>';
  s+='<circle cx="'+X(m.bs)+'" cy="'+Y(m.base)+'" r="3.4" fill="var(--good)"/><circle cx="'+X(2050)+'" cy="'+Y(0)+'" r="3.4" fill="var(--good)"/>';
  if(scn){
    var q='';for(y=2026;y<=2050;y++)q+=(y===2026?'M':'L')+X(y).toFixed(1)+' '+Y(scn.loc(y)).toFixed(1);
    s+='<path d="'+q+'" fill="none" stroke="var(--grid)" stroke-width="2.2"/>';
    if(scn.mkt){var q2='';for(y=2026;y<=2050;y++)q2+=(y===2026?'M':'L')+X(y).toFixed(1)+' '+Y(scn.mkt(y)).toFixed(1);
      s+='<path d="'+q2+'" fill="none" stroke="var(--grid)" stroke-width="2.2" stroke-dasharray="1.5 3.5" stroke-linecap="round"/>'}
  }
  if(m.bs<2030){var t3=m.tgt(2030),b3=scn?scn.loc(2030):m.bau(2030),d3=b3-t3;
    s+='<line x1="'+X(2030)+'" x2="'+X(2030)+'" y1="'+Y(b3)+'" y2="'+Y(t3)+'" stroke="var(--ink)" stroke-width="1.4"/><circle cx="'+X(2030)+'" cy="'+Y(b3)+'" r="2.4" fill="'+(scn?'var(--grid)':'var(--bad)')+'"/><circle cx="'+X(2030)+'" cy="'+Y(t3)+'" r="2.4" fill="var(--good)"/>';
    s+='<text x="'+(X(2030)+5)+'" y="'+((Y(b3)+Y(t3))/2+3)+'" style="fill:var(--ink);font-weight:500">'+tr('Gap ','ช่องว่าง ')+(scn?(d3>0?'+':'\u2212'):'')+nf(Math.abs(d3))+'</text>'}
  [2020,2030,2040,2050].forEach(function(y){s+='<text x="'+X(y)+'" y="'+(H-6)+'" text-anchor="middle">'+y+'</text>'});
  s+='<text x="'+pl+'" y="'+(pt-3)+'">tCO\u2082e/'+tr('yr','ปี')+'</text>';

function sparkline(vals,cur,w,h){
  var mx=Math.max.apply(null,vals)*1.1||1,s='<svg class="spark" viewBox="0 0 '+w+' '+h+'">',p='';
  vals.forEach(function(v,i){p+=(i?'L':'M')+(i*(w-4)/(vals.length-1)+2).toFixed(1)+' '+(h-3-(h-8)*v/mx).toFixed(1)});
  s+='<path d="'+p+'" fill="none" stroke="var(--ink)" stroke-width="1.4"/>';
  var cx=cur*(w-4)/(vals.length-1)+2;
  s+='<circle cx="'+cx+'" cy="'+(h-3-(h-8)*vals[cur]/mx)+'" r="3" fill="var(--good)"/></svg>';
  return s;
}

 {k:'ref',ic:'droplets',en:'Refrigerant leak reduction',th:'ลดการรั่วของสารทำความเย็น',min:0,max:90,step:5,unit:'%'},

 bau:{pv:0,cool:0,it:0,lt:0,plug:0,ref:0,rec:0,year:2028},
 eff:{pv:0,cool:20,it:10,lt:10,plug:8,ref:50,rec:0,year:2028},

function scnModel(){
  var s=st.scn,U=UNIT,a=LAST-11,m=nzModel(),G=D.meta.gwp;
  var base={};SYS.forEach(function(x){base[x.k]=sum(B.sys[x.k],a,LAST)});
  var pvEx=sum(B.pv,a,LAST),grid12=sum(B.grid,a,LAST),tot12=sum(B.total,a,LAST),tariff=sum(B.cost,a,LAST)/grid12;
  var kCool=s.cool/100*(base.chiller+base.ahu),kIt=s.it/100*base.it,kLt=s.lt/100*base.lt,kPl=s.plug/100*base.plug,kPv=s.pv*U.pvYield;
  var kEff=kCool+kIt+kLt+kPl,kSave=kEff+kPv;
  var refBau=sum(B.s1ref,36,71)/3,dslBau=sum(B.s1dsl,36,71)/3;
  var f=function(y){return y<s.year?0:y===s.year?0.5:1};
  var gridScn=function(y){return Math.max(0,E26.grid-f(y)*kSave)};
  var s1=function(y){return refBau*(1-s.ref/100*f(y))+dslBau};
  var loc=function(y){return y<=2026?m.bau(y):gridScn(y)*m.ef(y)/1000+s1(y)};
  var mkt=function(y){return y<=2026?m.bau(y):gridScn(y)*m.ef(y)/1000*(1-s.rec/100*f(y))+s1(y)};
  var meets=null;for(var y=2050;y>=Math.max(2027,s.year);y--){var t=m.tgt(y);if(t!==null&&(s.rec>0?mkt(y):loc(y))<=t)meets=y;else break}  /* earliest year from which the scenario stays on or below the target path to 2050 */
  var load=tot12-kEff,zeb={gross:load/A,net:(load-pvEx-kPv)/A,baseGross:tot12/A,baseNet:(tot12-pvEx)/A};
  var ef30=m.ef(2030),items=[];
  var add=function(key,name,kwh,capex,save,t,mk){if(t>0||kwh>0)items.push({key:key,name:name,kwh:kwh,capex:capex,save:save,t:t,mk:!!mk,
    pay:save>0&&capex>0?capex/save:null,cpt:t>0?(capex/U.life-save)/t:null})};
  add('pv',tr('Solar PV +'+s.pv+' kWp','Solar PV +'+s.pv+' kWp'),kPv,s.pv*U.pvCapex,kPv*tariff,kPv*ef30/1000);
  add('cool',tr('Cooling system','ระบบทำความเย็น'),kCool,kCool*U.cool,kCool*tariff,kCool*ef30/1000);
  add('it','UPS + IT',kIt,kIt*U.it,kIt*tariff,kIt*ef30/1000);
  add('lt',tr('Lighting','แสงสว่าง'),kLt,kLt*U.lt,kLt*tariff,kLt*ef30/1000);
  add('plug',tr('Plug loads','เครื่องใช้ไฟฟ้า'),kPl,kPl*U.plug,kPl*tariff,kPl*ef30/1000);
  var rt=refBau*s.ref/100;
  add('ref',tr('Refrigerant leaks','สารทำความเย็นรั่ว'),0,rt*U.refCapexPerT,rt*1000/G.r134a*U.refKgPrice,rt);
  var recKwh=s.rec/100*gridScn(2030),recCost=recKwh/1000*U.recPerMWh;
  if(s.rec>0)items.push({key:'rec',name:tr('Renewable certificates','ใบรับรองพลังงานหมุนเวียน'),kwh:recKwh,capex:0,save:-recCost,t:recKwh*ef30/1000,mk:true,pay:null,cpt:recKwh*ef30/1000>0?(recCost*-1*-1)/(recKwh*ef30/1000):null});
  var capex=0,save=0;items.forEach(function(x){capex+=x.capex;save+=x.save});
  return {m:m,loc:loc,mkt:s.rec>0?mkt:null,meets:meets,zeb:zeb,items:items,capex:capex,save:save,pay:save>0&&capex>0?capex/save:null,
    kSave:kSave,kPv:kPv,tariff:tariff,ef30:ef30,pvEx:pvEx};
}

function setTab(t){
  st.tab=t;

  bodyEl.innerHTML=t==='netzero'?nzStatic():t==='scenario'?viewScnStatic():'';
  bodyEl.scrollTop=0;

  updatePanel();
}
function updatePanel(){
  var t=st.tab,sc=bodyEl.scrollTop;
  if(t==='overview')bodyEl.innerHTML=viewOverview();
  else if(t==='zeb')bodyEl.innerHTML=viewZeb();
  else if(t==='netzero'){var d=$('#nzDyn');if(!d){bodyEl.innerHTML=nzStatic();d=$('#nzDyn')}d.innerHTML=viewNzDyn()}

function facadeTex(){
  /* coarse, low-contrast pane pattern + mipmaps + anisotropy: keeps the facade from shimmering when the camera moves */
  var c=document.createElement('canvas');c.width=512;c.height=128;var g=c.getContext('2d');
  g.fillStyle='#ffffff';g.fillRect(0,0,512,128);
  for(var i=0;i<4;i++){g.fillStyle='rgba(18,38,48,0.20)';g.fillRect(i*128+10,20,108,88);g.fillStyle='rgba(255,255,255,0.22)';g.fillRect(i*128+14,24,36,80)}
  var t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(2,1);
  t.generateMipmaps=true;t.minFilter=THREE.LinearMipmapLinearFilter;t.magFilter=THREE.LinearFilter;
  t.anisotropy=renderer.capabilities.getMaxAnisotropy();return t;
}
function panelTex(){
  var c=document.createElement('canvas');c.width=64;c.height=64;var g=c.getContext('2d');
  g.fillStyle='#ffffff';g.fillRect(0,0,64,64);g.strokeStyle='rgba(180,200,235,0.65)';g.lineWidth=1.5;
  for(var i=0;i<=6;i++){g.beginPath();g.moveTo(i*64/6,0);g.lineTo(i*64/6,64);g.stroke()}
  for(var j=0;j<=4;j++){g.beginPath();g.moveTo(0,j*16);g.lineTo(64,j*16);g.stroke()}
  var t=new THREE.CanvasTexture(c);t.anisotropy=renderer.capabilities.getMaxAnisotropy();return t;
}
var PSHADER_V='attribute float aSize;attribute float aAlpha;uniform float uScale;varying float vA;void main(){vA=aAlpha;vec4 mv=modelViewMatrix*vec4(position,1.0);gl_PointSize=max(1.0,aSize*uScale/-mv.z);gl_Position=projectionMatrix*mv;}';
var PSHADER_F='uniform vec3 uColor;varying float vA;void main(){float d=length(gl_PointCoord-vec2(0.5));if(d>0.5)discard;gl_FragColor=vec4(uColor,vA*smoothstep(0.5,0.12,d));}';

    if(E())return lab('snowflake','#2f6f9f','Chiller plant',fm(M.ch)+' MWh',M.ch/M.tot,pc(M.ch/M.tot)+tr(' of electricity',' ของไฟฟ้า'));
    var te=M.ch*M.gs*M.ef/1000,t=te+M.r134t,leak=M.r134t>10;
    return lab('snowflake','#2f6f9f','Chiller plant',ft(t)+' tCO\u2082e',t/M.t12,ft(te)+tr(' electricity + ',' ไฟฟ้า + ')+(leak?ic('triangle-alert','var(--bad)')+'<span class="bad">'+ft(M.r134t)+tr(' refrigerant leak',' สารทำความเย็นรั่ว')+'</span>':ft(M.r134t)+tr(' refrigerant',' สารทำความเย็น')));
  },true);
  tag('gen',gB1,[-4.4,-0.1,-2.9],function(k){
    var M=labMonth(k),nm=tr('Genset','เครื่องปั่นไฟ');
    if(E())return lab('fuel','#e0892b',nm,tr('diesel ','ดีเซล ')+nf(M.dslL)+tr(' L',' ลิตร'),null,'');
    return lab('fuel','#e0892b',nm,ft(M.s1dsl)+' tCO\u2082e',M.s1dsl/M.t12,tr('Scope 1, diesel ','Scope 1 ดีเซล ')+nf(M.dslL)+tr(' L',' ลิตร'));
  },true);
  tag('s2',GL.pyl,[0,3.5,0],function(k){
    var M=labMonth(k);
    if(E())return lab('plug','var(--s2)',tr('Grid import','ไฟจากกริด'),fm(M.grid)+' MWh',M.grid/M.tot,pc(M.grid/M.tot)+tr(' of building use',' ของไฟทั้งตึก'));
    return lab('factory','var(--s2)','Scope 2',ft(M.s2)+' tCO\u2082e',M.s2/M.t12,pc(M.s2/M.t12)+tr(' of Scope 1+2, EF ',' ของ Scope 1+2, EF ')+M.ef.toFixed(4));
  });
  tag('vent',g4,[-4.9,podTop+1.0,3.25],function(k){
    var M=labMonth(k);
    return lab('flame','var(--s1)','Scope 1',ft(M.s1)+' tCO\u2082e',M.s1/M.t12,tr('refrigerant ','สารทำความเย็น ')+ft(M.s1ref)+tr(', diesel ',', ดีเซล ')+ft(M.s1dsl));
  },false,0,0,'carbon');
  applyTheme();onResize();
}

var deskMQ=matchMedia('(min-width:641px)');
function panelW(){return deskMQ.matches&&panelOpen?$('#panel').offsetWidth:0}
function applyView(){
  if(!GL||!GL.w)return;
  if(Math.abs(GL.vo)<0.01)camera.clearViewOffset();else camera.setViewOffset(GL.w,GL.h,GL.vo,0,GL.w,GL.h);
}
function onResize(){
  if(!GL)return;
  var st0=$('#stage'),w=st0.clientWidth,h=st0.clientHeight;if(!w||!h)return;
  renderer.setSize(w,h,false);camera.aspect=w/h;GL.w=w;GL.h=h;
  var vw=w-panelW();cam.rBase=vw/h<1?50:(vw/h<1.5?31:36);if(!GL.userZoom)cam.r=cam.rBase;
  camera.updateProjectionMatrix();GL.vo=panelW()/2;applyView();
  pointMats.forEach(function(m){m.uniforms.uScale.value=h*1.45});
  updCam();
}
function updCam(){
  var sp=Math.sin(cam.phi),ex=exCur||0,r=cam.r*(1+ex*0.28),ty=cam.ty+ex*2.8;
  camera.position.set(cam.tx+r*sp*Math.sin(cam.theta),ty+r*Math.cos(cam.phi),cam.tz+r*sp*Math.cos(cam.theta));
  camera.lookAt(cam.tx,ty,cam.tz);
}

function styleFloors(){
  if(!GL)return;
  var sel=st.sel,hov=st.hov,kk=st.idx;
  var hot=st.mode==='carbon'&&(eqVal(0,kk)>140||eqVal(1,kk)>140);
  ghostGround=st.xray||hot||(sel===0||sel===1)||(hov===0||hov===1);
  groundMat.opacity=ghostGround?0.28:1;groundMat.depthWrite=!ghostGround;
  FM.forEach(function(f,i){
    var m=f.mat,op=st.xray?0.14:0.93,em=GL.dark?0.2:0.12;
    if(sel>=0){if(i===sel){op=st.xray?0.6:1;em=0.4}else op=st.xray?0.05:0.16}
    if(hov>=0&&i===hov){op=Math.max(op,st.xray?0.6:1);em=0.5}
    m.opacity=op;m.emissiveIntensity=em;m.depthWrite=op>0.5;
  });
}

function updateTags(){
  if(!GL)return;
  var w=$('#stage').clientWidth,h=$('#stage').clientHeight,v=new THREE.Vector3(),placed=[],pw=panelW();
  tags.forEach(function(t){
    var vis=st.labels&&(!t.xo||st.xray||ghostGround)&&(!t.mode||t.mode===st.mode),x=0,y=0;
    if(vis){t.a.getWorldPosition(v);v.project(camera);
      if(v.z>1||v.z<-1||Math.abs(v.x)>1.05||Math.abs(v.y)>1.05)vis=false;
      else{x=(v.x*0.5+0.5)*w+t.dx;y=(-v.y*0.5+0.5)*h+t.dy}}
    if(!vis){t.el.style.display='none';return}
    t.el.style.display='block';
    var bw=t.el.offsetWidth,bh=t.el.offsetHeight,y0=y,x0=x,ex=t.el.classList.contains('open')||t.el.matches(':hover')||t.el===document.activeElement;
    x=Math.max(bw/2+6,Math.min(x,w-pw-bw/2-6));   /* keep labels inside the part of the stage the panel does not cover */
    for(var it=0;it<(ex?0:8);it++){            /* labels are drawn above their anchor: move a label up while it overlaps one already placed */
      var hit=null;
      for(var j=0;j<placed.length;j++){var q=placed[j];
        if(x-bw/2<q.x+q.w/2+4&&x+bw/2>q.x-q.w/2-4&&y-bh<q.y+2&&y>q.y-q.h-2){hit=q;break}}
      if(!hit)break;y=hit.y-hit.h-4;
    }
    if(!ex)placed.push({x:x,y:y,w:bw,h:bh});
    t.el.style.left=x+'px';t.el.style.top=y+'px';t.el.classList.toggle('moved',Math.abs(y-y0)>1||Math.abs(x-x0)>1);
  });
}
function refreshTags_(){}
document.addEventListener('click',function(e){if(!e.target.closest||!e.target.closest('.tag'))tags.forEach(function(q){q.el.classList.remove('open');q.el.setAttribute('aria-expanded','false')})});
var lastTagMode=null;
function refreshTags(){
  var ch=lastTagMode!==null&&lastTagMode!==st.mode;lastTagMode=st.mode;
  tags.forEach(function(t){t.el.innerHTML=t.fn(st.idx);if(ch){t.el.classList.remove('fade');void t.el.offsetWidth;t.el.classList.add('fade')}});
}

var ptrs=new Map(),dragInfo=null,pinch0=0;
function dist2(){var a=[...ptrs.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}
var ray,mp;
function pick(ev){
  var r=$('#gl').getBoundingClientRect();mp.set((ev.clientX-r.left)/r.width*2-1,-(ev.clientY-r.top)/r.height*2+1);
  ray.setFromCamera(mp,camera);
  var hits=ray.intersectObjects(FM.map(function(f){return f.body}),false);
  for(var j=0;j<hits.length;j++){var i=hits[j].object.userData.i;if(i<2&&!ghostGround)continue;return i}
  return -1;
}
var tipKey='';
function tipHtml(i,k){
  var f=FL[i],kw=flKwh(i,k),sec=annKwhM2(i,k),eq=eqVal(i,k),col=heatCss(eq),rgb=heatRGB(eq),t=flT(i,k),p=flParts(i,k);
  var prev=k>=12?annKwhM2(i,k-12):null,yo=prev?(sec-prev)/prev:null;
  var order=FL.map(function(x,j){return j}).sort(function(a,b){return eqVal(b,k)-eqVal(a,k)});
  var rank=order.indexOf(i)+1;
  var parts=[['ac',tr('Air-con','แอร์'),'#2f6f9f'],['lt',tr('Lighting','แสงสว่าง'),'#d9a21b'],['eq','Plug + IT','#7360b0'],['ot',tr('Other','อื่นๆ'),'#bb7a4c']];
  var h='<div class="tp-h"><span class="dot" style="background:'+col+'"></span><b>'+tr('Floor ','ชั้น ')+f.id+'</b><span class="u">'+fuse(f)+'</span>'+
    '<span class="tp-chip" style="background:rgba('+Math.round(rgb[0])+','+Math.round(rgb[1])+','+Math.round(rgb[2])+',0.22)">'+nf(eq/ZEB,1)+'\u00D7 ZEB</span></div>';
  h+='<div class="tp-sub">'+lbl(k)+(st.scnView?', '+tr('after measures','หลังปรับปรุง'):'')+'</div>';
  h+='<div class="tp-k"><div><i>kWh</i><b>'+nf(kw)+'</b></div>'+
     '<div><i>SEC</i><b style="color:'+heatCss(annKwhM2(i,k))+'">'+nf(sec,0)+'</b><s>'+(yo===null?'\u2013':dTxt(yo,true))+'</s></div>'+
     '<div><i>tCO\u2082e</i><b>'+nf(t,1)+'</b><s>'+nf(annKgM2(i,k),0)+' kg/m\u00B2</s></div></div>';
  h+='<div class="tp-bar">';parts.forEach(function(q){h+='<i style="width:'+(p[q[0]]/kw*100)+'%;background:'+q[2]+'"></i>'});h+='</div><div class="tp-leg">';
  parts.forEach(function(q){h+='<span><span style="color:'+q[2]+'">\u25CF</span> '+q[1]+' <b>'+nf(p[q[0]]/kw*100,0)+'%</b></span>'});h+='</div>';
  h+='<div class="tp-rk">'+tr('Rank ','อันดับ ')+'<b>'+rank+tr(' of ',' จาก ')+NF+'</b>'+tr(' floors, highest first',' ชั้น (สูงสุดก่อน)')+'</div>';
  h+='<svg viewBox="0 0 220 30" width="100%" role="img" aria-label="'+tr('Rank of this floor among all floors','อันดับของชั้นนี้เทียบทุกชั้น')+'" style="display:block">';
  order.forEach(function(j,n){var v=Math.min(eqVal(j,k),160),bh=Math.max(3,v/160*28);
    h+='<rect x="'+(n*10)+'" y="'+(30-bh)+'" width="7.5" height="'+bh+'" rx="1" '+(j===i?'fill="'+col+'"':'fill="var(--ink2)" opacity=".38"')+'/>'});
  h+='</svg>';
  h+='<div class="tp-ft">'+nf(f.users[k])+tr(' people, ',' คน, ')+nf(f.area)+' m\u00B2</div>';
  return h;
}
function tipShow(i,ev){
  var tip=$('#tip'),k=st.idx,sc=st.scn;
  var key=[i,k,st.mode,st.scnView,sc.pv,sc.cool,sc.it,sc.lt,sc.plug,sc.ref,LANG].join('|');
  if(key!==tipKey){tipKey=key;tip.innerHTML=tipHtml(i,k)}
  tip.style.display='block';
  var r=$('#stage').getBoundingClientRect(),w=tip.offsetWidth,h=tip.offsetHeight;
  var x=ev.clientX-r.left+16,y=ev.clientY-r.top+14;
  var rw=r.width-panelW();
  if(x+w>rw-6)x=ev.clientX-r.left-w-16;
  if(y+h>r.height-6)y=r.height-h-6;
  tip.style.left=Math.max(6,x)+'px';tip.style.top=Math.max(6,y)+'px';
}
function bindPointer(){
  var c=$('#gl');ray=new THREE.Raycaster();mp=new THREE.Vector2();
  c.addEventListener('pointerdown',function(e){
    c.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    dragInfo={t:performance.now(),moved:0};if(ptrs.size===2)pinch0=dist2();$('#tip').style.display='none';
  });
  c.addEventListener('pointermove',function(e){
    if(!ptrs.has(e.pointerId)){
      if(e.pointerType==='mouse'){var i=pick(e);if(i!==st.hov){st.hov=i;styleFloors()}
        if(i>=0)tipShow(i,e);else $('#tip').style.display='none'}
      return}
    var p=ptrs.get(e.pointerId),dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
    if(ptrs.size===1){cam.theta-=dx*0.006;cam.phi=clamp(cam.phi-dy*0.005,0.2,1.5);dragInfo.moved+=Math.abs(dx)+Math.abs(dy)}
    else if(ptrs.size===2){var d=dist2();cam.r=clamp(cam.r*pinch0/d,12,90);pinch0=d;dragInfo.moved+=99;GL.userZoom=true}
    updCam();
  });
  function up(e){
    var was=ptrs.has(e.pointerId);ptrs.delete(e.pointerId);
    if(was&&dragInfo&&dragInfo.moved<6&&performance.now()-dragInfo.t<600&&ptrs.size===0){
      var i=pick(e);if(i>=0)selectFloor(i,false);else if(st.sel>=0){st.sel=-1;styleFloors();updatePanel()}
    }
  }
  c.addEventListener('pointerup',up);c.addEventListener('pointercancel',function(e){ptrs.delete(e.pointerId)});
  c.addEventListener('pointerleave',function(e){if(e.pointerType==='mouse'){$('#tip').style.display='none';if(st.hov!==-1){st.hov=-1;styleFloors()}}});
  c.addEventListener('wheel',function(e){cam.r=clamp(cam.r*(1+e.deltaY*0.0012),12,90);GL.userZoom=true;updCam()},{passive:true});
}

/* ====================================================== apply state */
function apply(){
  var k=st.idx;
  slider.value=k;$('#mlabel').textContent=lbl(k);$('#ev').textContent=evText(k);
  updLegend();
  if(GL){
    FM.forEach(function(f,i){f.tcol=heatRGB(eqVal(i,k))});
    var n=B.kwp[k]/D.meta.kwpPerGroup;pvPanels.forEach(function(p,j){p.visible=j<n});
    var ns=st.scnView?st.scn.pv/10:0;pvScn.forEach(function(p,j){p.visible=j<ns});GL.canopy.visible=ns>35;
    var yieldIdx=B.kwp[k]?B.pv[k]/(B.kwp[k]*D.days[k]*3.4):0;pvMat.emissiveIntensity=0.1+0.5*clamp(yieldIdx,0,1.2);
    ventPlume.rate=clamp(B.s1[k]/200,0.03,1);
    GL.flowSpeed=0.04+0.16*clamp(B.grid[k]/450000,0,1);
    var itL=clamp(B.sys.it[k]/110000,0.2,1.2);racks.forEach(function(r){r.material.emissiveIntensity=0.25+0.7*itL});
    GL.chL=clamp(B.sys.chiller[k]/130000,0.1,1.3);chillers.forEach(function(c){c.material.emissiveIntensity=0.1+0.6*GL.chL});
    genMesh.material.emissiveIntensity=0.1+clamp(B.dslL[k]/400,0,1)*0.9;
    refreshTags();styleFloors();
  }
  updatePanel();
}

var lastT=0,clockT=0;
function loop(ts){
  requestAnimationFrame(loop);
  var dt=Math.min(0.05,(ts-lastT)/1000||0.016);lastT=ts;clockT+=dt;
  if(st.play){playAcc+=dt;if(playAcc>0.42){playAcc=0;if(st.idx<LAST)setIdx(st.idx+1);else{st.play=false;setPlayIcon()}}}
  if(!GL)return;
  if(st.rotate&&ptrs.size===0){cam.theta+=dt*0.07;updCam()}
  var vt=panelW()/2;if(Math.abs(vt-GL.vo)>0.3){GL.vo+=(vt-GL.vo)*Math.min(1,dt*9);applyView()}else if(GL.vo!==vt){GL.vo=vt;applyView()}
  var exT=st.explode?1:0;exCur+=(exT-exCur)*Math.min(1,dt*4);if(Math.abs(exT-exCur)>0.002)updCam();
  FM.forEach(function(f,i){
    f.grp.position.y=exCur*(i-2)*0.26;
    for(var c=0;c<3;c++)f.col[c]+=(f.tcol[c]-f.col[c])*Math.min(1,dt*6);
    f.mat.color.setRGB(f.col[0]/255,f.col[1]/255,f.col[2]/255);f.mat.emissive.setRGB(f.col[0]/255,f.col[1]/255,f.col[2]/255);
  });
  var rs=reduce?0.2:1;
  ventPlume.update(dt*rs);
  flowT=(flowT+dt*GL.flowSpeed*rs)%1;flowA.update(flowT);
  fans.forEach(function(f){f.rotation.y+=dt*(2+8*(GL.chL||0.5))});
  GL.tip.visible=Math.floor(clockT*1.2)%2===0;
  updateTags();
  renderer.render(scene,camera);
}

/* ====================================================== boot */
applyLang();buildTicks();themeIcon();
setTab('overview');
try{
  initScene();bindPointer();
  new ResizeObserver(onResize).observe($('#stage'));
}catch(err){
  console.warn('3D unavailable:',err);GL=null;$('#gl').style.display='none';$('#fallback').style.display='grid';$('#tools').style.display='none';
}
apply();
if(GL)FM.forEach(function(f,i){f.col=heatRGB(eqVal(i,st.idx));f.tcol=f.col.slice()});
styleFloors();
requestAnimationFrame(loop);
window.__twin={st:st,setIdx:setIdx,setTab:setTab,selectFloor:selectFloor,setLang:setLang,cam:cam,updCam:updCam,apply:apply,
  dbg:function(){return {GL:GL,scene:scene,renderer:renderer,camera:camera,FM:FM,tags:tags}}};
})();
</script>
